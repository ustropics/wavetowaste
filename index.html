<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave to Waste</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f14; }
    iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    #iframe-beached { z-index: 1; }
    #iframe-nesting  { z-index: 1; display: none; }
  </style>
</head>
<body>
  <iframe id="iframe-beached" src="combined_florida_beached_map.html" title="Beached Map"></iframe>
  <iframe id="iframe-nesting"  src="internesting_map.html"            title="Inter-Nesting Zones"></iframe>

  <script>
    let activeView = 'beached';

    function toggleView() {
      const beachedFrame = document.getElementById('iframe-beached');
      const nestingFrame  = document.getElementById('iframe-nesting');
      if (activeView === 'beached') {
        activeView = 'nesting';
        beachedFrame.style.display = 'none';
        nestingFrame.style.display  = 'block';
      } else {
        activeView = 'beached';
        beachedFrame.style.display = 'block';
        nestingFrame.style.display  = 'none';
      }
    }

    window.addEventListener('message', function (e) {
      if (e.data && e.data.action === 'toggleView') toggleView();
    });
  </script>
</body>
</html>
