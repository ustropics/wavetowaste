<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Carlo Beaching — Florida Endpoints</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-panel: #0f1923;
    --bg-panel-alpha: rgba(15, 25, 35, 0.92);
    --text-primary: #e8edf2;
    --text-secondary: #7a8fa3;
    --accent: #899b2f;
    --accent-rgb: 137, 155, 47;
    --accent-dim: rgba(137, 155, 47, 0.15);
    --danger: #ff6b6b;
    --warning: #ffc145;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0f14; color: var(--text-primary);
    overflow: hidden; height: 100vh; width: 100vw;
  }
  #map { position: absolute; inset: 0; z-index: 1; }

  .panel {
    position: absolute; top: 16px; left: 16px; z-index: 1000;
    background: var(--bg-panel-alpha);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
    width: 310px; box-shadow: var(--shadow); overflow: hidden;
    max-height: calc(100vh - 100px); overflow-y: auto;
  }
  .panel.collapsed .panel-body { display: none; }
  .panel.collapsed { width: auto; overflow-y: hidden; }
  .panel-header {
    padding: 16px 18px; display: flex; align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer; user-select: none;
    position: sticky; top: 0; background: var(--bg-panel); z-index: 2;
  }
  .panel-header:hover { background: rgba(255,255,255,0.03); }
  .panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--accent); }
  .panel-toggle { font-size: 18px; color: var(--text-secondary); transition: transform 0.3s; }
  .panel.collapsed .panel-toggle { transform: rotate(180deg); }
  .panel-body { padding: 14px 18px 18px; }

  .layer-section { margin-bottom: 14px; }
  .layer-section-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }

  .layer-toggle { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s; margin-bottom: 4px; }
  .layer-toggle:hover { background: rgba(255,255,255,0.04); }
  .layer-toggle input[type="checkbox"] { display: none; }
  .toggle-track { width: 36px; height: 20px; border-radius: 10px; background: #2a3a4a; position: relative; transition: background 0.2s; flex-shrink: 0; }
  .toggle-track::after { content: ''; width: 16px; height: 16px; border-radius: 50%; background: #556; position: absolute; top: 2px; left: 2px; transition: all 0.2s; }
  .layer-toggle input:checked + .toggle-track { background: var(--accent); }
  .layer-toggle input:checked + .toggle-track::after { background: #fff; left: 18px; }
  .toggle-label { font-size: 13px; font-weight: 500; }
  .toggle-sub { font-size: 11px; color: var(--text-secondary); }

  .slider-group { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
  .slider-row { margin-bottom: 10px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .slider-value { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 11px; }
  input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #2a3a4a; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.4); }

  .stats-bar { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 1000; background: var(--bg-panel-alpha); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 24px; display: flex; gap: 32px; box-shadow: var(--shadow); }
  .stat-item { text-align: center; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-secondary); }

  .leaflet-popup-content-wrapper { background: var(--bg-panel) !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 8px !important; color: var(--text-primary) !important; box-shadow: var(--shadow) !important; }
  .leaflet-popup-tip { background: var(--bg-panel) !important; }
  .popup-content { font-family: 'DM Sans', sans-serif; font-size: 12px; line-height: 1.6; }
  .popup-content strong { color: var(--accent); font-weight: 600; }
  .popup-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .popup-divider { border-top: 1px solid rgba(255,255,255,0.08); margin: 6px 0; }

  .legend { position: absolute; bottom: 80px; right: 16px; z-index: 1000; background: var(--bg-panel-alpha); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 160px; }
  .legend-title { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; }
  .legend-gradient { width: 100%; height: 12px; border-radius: 6px; margin-bottom: 4px; }
  .legend-labels { display: flex; justify-content: space-between; font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); }

  .year-filters { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
  .year-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .year-pill { padding: 3px 9px; border-radius: 4px; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 500; background: #2a3a4a; color: var(--text-secondary); cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
  .year-pill.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(var(--accent-rgb), 0.3); }
  .year-pill:hover { background: rgba(255,255,255,0.08); }
  .year-pill.active:hover { background: rgba(var(--accent-rgb), 0.25); }

  .download-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
  .download-btns { display: flex; flex-direction: column; gap: 6px; }
  .download-btn { width: 100%; padding: 10px 14px; border: 1px solid rgba(var(--accent-rgb), 0.3); border-radius: 6px; background: var(--accent-dim); color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .download-btn:hover { background: rgba(var(--accent-rgb), 0.25); border-color: var(--accent); }
  .download-btn:active { transform: scale(0.98); }
  .download-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div id="map"></div>

<div class="panel" id="controlPanel">
  <div class="panel-header" onclick="document.getElementById('controlPanel').classList.toggle('collapsed')">
    <span class="panel-title">MC Florida Beaching</span>
    <span class="panel-toggle">&#9660;</span>
  </div>
  <div class="panel-body">
    <div class="layer-section">
      <div class="layer-section-label">Heatmaps</div>
      <label class="layer-toggle">
        <input type="checkbox" id="togMpwHeat" checked>
        <span class="toggle-track"></span>
        <span><span class="toggle-label">MPW Heatmap</span><br><span class="toggle-sub">Weight-based gradient</span></span>
      </label>
      <label class="layer-toggle">
        <input type="checkbox" id="togDensityHeat">
        <span class="toggle-track"></span>
        <span><span class="toggle-label">Density Heatmap</span><br><span class="toggle-sub">Particle count gradient</span></span>
      </label>
    </div>
    <div class="layer-section">
      <div class="layer-section-label">Overlays</div>
      <label class="layer-toggle">
        <input type="checkbox" id="togDots">
        <span class="toggle-track"></span>
        <span><span class="toggle-label">Particle Endpoints</span><br><span class="toggle-sub">Individual markers</span></span>
      </label>
    </div>

    <div class="slider-group">
      <div class="slider-row">
        <div class="slider-label"><span>Heatmap Radius</span><span class="slider-value" id="radiusVal">25</span></div>
        <input type="range" id="radiusSlider" min="5" max="60" value="25">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>Heatmap Blur</span><span class="slider-value" id="blurVal">15</span></div>
        <input type="range" id="blurSlider" min="1" max="40" value="15">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>Intensity Cap (pctl)</span><span class="slider-value" id="capVal">75</span></div>
        <input type="range" id="capSlider" min="10" max="100" value="75">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>Dot Opacity</span><span class="slider-value" id="dotOpacityVal">0.6</span></div>
        <input type="range" id="dotOpacitySlider" min="10" max="100" value="60">
      </div>
    </div>

    <div class="year-filters">
      <div class="layer-section-label">Filter by Year</div>
      <div class="year-pills" id="yearPills"></div>
    </div>

    <div class="download-section">
      <div class="layer-section-label">Export</div>
      <div class="download-btns">
        <button class="download-btn" onclick="downloadShapefile()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Shapefile (.zip)
        </button>
        <button class="download-btn" onclick="downloadGeoJSON()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Filtered GeoJSON
        </button>
      </div>
    </div>
  </div>
</div>

<div class="legend" id="legend">
  <div class="legend-title" id="legendTitle">MPW Intensity</div>
  <div class="legend-gradient" id="legendGradient"
       style="background: linear-gradient(to right, #0a1628, #003344, #00887a, #899b2f, #ffc145, #ff6b6b);"></div>
  <div class="legend-labels"><span>Low</span><span>High</span></div>
</div>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-value" id="statParticles">&mdash;</div><div class="stat-label">Particles</div></div>
  <div class="stat-item"><div class="stat-value" id="statMpw">&mdash;</div><div class="stat-label">Total MPW (t)</div></div>
  <div class="stat-item"><div class="stat-value" id="statAvgConf">&mdash;</div><div class="stat-label">Avg Bin Conf</div></div>
  <div class="stat-item"><div class="stat-value" id="statYears">&mdash;</div><div class="stat-label">Years</div></div>
</div>

const allParticles = MAP_DATA.particles || [];
const stats = MAP_DATA.stats || {};
let activeYears = new Set();
let mpwHeatLayer = null, densityHeatLayer = null, dotsLayer = null;
const ACCENT = "#899b2f";

const map = L.map("map", { center: [27.8, -83.0], zoom: 7, zoomControl: false });
L.control.zoom({ position: "topright" }).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: "abcd", maxZoom: 19 }).addTo(map);

(function init() {
  const years = [...new Set(allParticles.map(p => p.year))].sort();
  activeYears = new Set(years);
  const pillsEl = document.getElementById("yearPills");

  const allPill = document.createElement("span");
  allPill.className = "year-pill active"; allPill.textContent = "All";
  allPill.onclick = () => { activeYears = new Set(years); updatePills(); rebuildLayers(); };
  pillsEl.appendChild(allPill);

  years.forEach(y => {
    const pill = document.createElement("span");
    pill.className = "year-pill active"; pill.dataset.year = y; pill.textContent = y;
    pill.onclick = () => {
      if (activeYears.has(y)) activeYears.delete(y); else activeYears.add(y);
      updatePills(); rebuildLayers();
    };
    pillsEl.appendChild(pill);
  });

  updateStatsBar(allParticles);
  rebuildLayers();

  if (allParticles.length > 0) {
    const lats = allParticles.map(p => p.lat);
    const lons = allParticles.map(p => p.lon);
    map.fitBounds([[Math.min(...lats)-0.3, Math.min(...lons)-0.3],
                    [Math.max(...lats)+0.3, Math.max(...lons)+0.3]]);
  }

  ["togMpwHeat","togDensityHeat","togDots"].forEach(id =>
    document.getElementById(id).addEventListener("change", rebuildLayers));
  document.getElementById("radiusSlider").addEventListener("input", e => {
    document.getElementById("radiusVal").textContent = e.target.value; rebuildHeatmaps();
  });
  document.getElementById("blurSlider").addEventListener("input", e => {
    document.getElementById("blurVal").textContent = e.target.value; rebuildHeatmaps();
  });
  document.getElementById("capSlider").addEventListener("input", e => {
    document.getElementById("capVal").textContent = e.target.value;
    rebuildHeatmaps(); rebuildDots();
  });
  document.getElementById("dotOpacitySlider").addEventListener("input", e => {
    document.getElementById("dotOpacityVal").textContent = (e.target.value/100).toFixed(2);
    rebuildDots();
  });
})();

function updatePills() {
  const pills = document.querySelectorAll(".year-pill");
  const years = [...new Set(allParticles.map(p => p.year))].sort();
  pills.forEach(pill => {
    if (pill.textContent === "All") pill.classList.toggle("active", activeYears.size === years.length);
    else pill.classList.toggle("active", activeYears.has(parseInt(pill.dataset.year)));
  });
}

function getFiltered() { return allParticles.filter(p => activeYears.has(p.year)); }

function percentile(arr, pct) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b) => a - b);
  return s[Math.max(0, Math.ceil((pct/100)*s.length) - 1)];
}

function updateStatsBar(pts) {
  document.getElementById("statParticles").textContent = pts.length.toLocaleString();
  document.getElementById("statMpw").textContent = pts.reduce((s,p) => s + p.mpw, 0).toFixed(2);
  const avgConf = pts.length > 0 ? pts.reduce((s,p) => s + p.best_bin_pct, 0) / pts.length : 0;
  document.getElementById("statAvgConf").textContent = avgConf.toFixed(1) + "%";
  const years = [...new Set(pts.map(p => p.year))].sort();
  document.getElementById("statYears").textContent = years.length > 1
    ? years[0] + "\u2013" + years[years.length-1] : (years[0] || "\u2014");
}

function rebuildLayers() {
  rebuildHeatmaps(); rebuildDots();
  updateStatsBar(getFiltered());
}

function rebuildHeatmaps() {
  const pts = getFiltered();
  const radius = parseInt(document.getElementById("radiusSlider").value);
  const blur = parseInt(document.getElementById("blurSlider").value);
  const capPct = parseInt(document.getElementById("capSlider").value);

  if (mpwHeatLayer) { map.removeLayer(mpwHeatLayer); mpwHeatLayer = null; }
  if (document.getElementById("togMpwHeat").checked && pts.length > 0) {
    const vals = pts.filter(p => p.mpw > 0).map(p => p.mpw);
    const mx = Math.max(percentile(vals, capPct), 0.001);
    mpwHeatLayer = L.heatLayer(
      pts.filter(p => p.mpw > 0).map(p => [p.lat, p.lon, Math.min(p.mpw/mx, 1.0)]),
      { radius, blur, maxZoom: 17, max: 1.0,
        gradient: {0.0:"#0a1628",0.2:"#003344",0.4:"#00887a",0.6:ACCENT,0.8:"#ffc145",1.0:"#ff6b6b"} }
    ).addTo(map);
  }

  if (densityHeatLayer) { map.removeLayer(densityHeatLayer); densityHeatLayer = null; }
  if (document.getElementById("togDensityHeat").checked && pts.length > 0) {
    densityHeatLayer = L.heatLayer(pts.map(p => [p.lat, p.lon, 1]),
      { radius, blur, maxZoom: 17, max: 1.0,
        gradient: {0.0:"#0a1628",0.2:"#1a1a5e",0.4:"#5b2c8e",0.6:"#c44ec2",0.8:"#ff85b8",1.0:"#ffe0f0"} }
    ).addTo(map);
  }

  const mpwOn = document.getElementById("togMpwHeat").checked;
  const denOn = document.getElementById("togDensityHeat").checked;
  const leg = document.getElementById("legend");
  if (!mpwOn && !denOn) { leg.style.display = "none"; return; }
  leg.style.display = "";
  if (denOn && !mpwOn) {
    document.getElementById("legendTitle").textContent = "Particle Density";
    document.getElementById("legendGradient").style.background =
      "linear-gradient(to right, #0a1628, #1a1a5e, #5b2c8e, #c44ec2, #ff85b8, #ffe0f0)";
  } else {
    document.getElementById("legendTitle").textContent = mpwOn && denOn ? "MPW + Density" : "MPW Intensity";
    document.getElementById("legendGradient").style.background =
      "linear-gradient(to right, #0a1628, #003344, #00887a, "+ACCENT+", #ffc145, #ff6b6b)";
  }
}

function rebuildDots() {
  if (dotsLayer) { map.removeLayer(dotsLayer); dotsLayer = null; }
  if (!document.getElementById("togDots").checked) return;
  const pts = getFiltered();
  if (!pts.length) return;

  const opacity = parseInt(document.getElementById("dotOpacitySlider").value) / 100;
  const capPct = parseInt(document.getElementById("capSlider").value);
  const vals = pts.filter(p => p.mpw > 0).map(p => p.mpw);
  const mx = Math.max(percentile(vals, capPct), 0.001);
  dotsLayer = L.layerGroup();

  pts.forEach(p => {
    const t = p.mpw > 0 ? Math.min(Math.max(0.2, p.mpw/mx), 1.0) : 0.15;
    const col = p.mpw > 0 ? interpColor(t) : "#556677";
    const m = L.circleMarker([p.lat, p.lon], {
      radius: 3, weight: 0, fillColor: col, fillOpacity: opacity,
    });
    m.bindPopup(
      '<div class="popup-content">' +
      '<div class="popup-title">Particle ' + p.pid + '</div>' +
      '<strong>Released:</strong> ' + p.year + '-' + String(p.month).padStart(2,'0') + '<br>' +
      '<strong>MPW:</strong> ' + (p.mpw > 0 ? p.mpw.toFixed(4) + ' t' : 'N/A') + '<br>' +
      '<strong>Distance:</strong> ' + p.dist.toFixed(1) + ' km<br>' +
      '<div class="popup-divider"></div>' +
      '<strong>MC trials beached:</strong> ' + p.trials + '/' + p.trials_total +
      ' (' + p.beach_pct + '%)<br>' +
      '<strong>Best bin confidence:</strong> ' + p.best_bin_pct + '%<br>' +
      '<strong>Unique bins:</strong> ' + p.n_bins + '<br>' +
      '<div class="popup-divider"></div>' +
      '<strong>Beach day:</strong> avg ' + p.avg_day +
      ', med ' + p.med_day + '<br>' +
      '<strong>Range:</strong> ' + p.min_day + '\u2013' + p.max_day + ' days' +
      '</div>'
    );
    dotsLayer.addLayer(m);
  });
  dotsLayer.addTo(map);
}

function interpColor(t) {
  const stops = [[0,[0,51,68]],[0.3,[0,136,122]],[0.5,[137, 155, 47]],[0.7,[255,193,69]],[1,[255,107,107]]];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t <= stops[i+1][0]) {
      const r = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      const [c0,c1] = [stops[i][1], stops[i+1][1]];
      return `rgb(${Math.round(c0[0]+r*(c1[0]-c0[0]))},${Math.round(c0[1]+r*(c1[1]-c0[1]))},${Math.round(c0[2]+r*(c1[2]-c0[2]))})`;
    }
  }
  return "rgb(255,107,107)";
}

function downloadShapefile() {
  const b = atob(SHP_ZIP_B64);
  const a8 = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a8[i] = b.charCodeAt(i);
  const blob = new Blob([a8], { type: "application/zip" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url;
  a.download = "mc_florida_beached_shapefile.zip";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function downloadGeoJSON() {
  const filtered = getFiltered();
  const features = filtered.map(p => ({
    type: "Feature",
    geometry: { type: "Point", coordinates: [p.lon, p.lat] },
    properties: {
      pid: p.pid, year: p.year, month: p.month,
      mpw_tons: p.mpw, distance_km: p.dist,
      avg_beach_day: p.avg_day, median_beach_day: p.med_day,
      min_beach_day: p.min_day, max_beach_day: p.max_day,
      trials_beached: p.trials, trials_total: p.trials_total,
      beach_pct: p.beach_pct, best_bin_pct: p.best_bin_pct,
      n_unique_bins: p.n_bins,
      start_lat: p.start_lat, start_lon: p.start_lon,
    },
  }));
  const geojson = { type: "FeatureCollection", features };
  const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/geo+json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url;
  a.download = "mc_florida_beached.geojson";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
</script>
