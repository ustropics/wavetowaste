<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nesting Zone Explorer — January 2011</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
    --bg:      #0d0f0e;
    --bg2:     #141816;
    --bg3:     #1c211e;
    --border:  #2a302c;
    --accent:  #899b2f;
    --accent2: #b8cc3f;
    --text:    #e8ede9;
    --muted:   #7a8a7d;
    --blue:    #6ab8cc;
    --blue2:   #4a7a8a;
    --mono:    'DM Mono', monospace;
    --sans:    'Syne', sans-serif;
    --sidebar: 340px;
    --header:  52px;
    --tray:    320px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: var(--header) 1fr;
    grid-template-columns: 1fr var(--sidebar);
    grid-template-areas: "header header" "map sidebar";
}

/* ── Header ── */
header {
    grid-area: header;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    z-index: 1200;
}
header h1 { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent2); white-space: nowrap; }
.header-pills { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-family: var(--mono); font-size: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; padding: 3px 8px; color: var(--muted); white-space: nowrap; }
.pill span { color: var(--accent2); font-weight: 500; }

/* ── Stat bar (trajectory mode) ── */
#statbar {
    display: none;
    position: absolute;
    bottom: 0; left: 0; right: var(--sidebar);
    z-index: 1100;
    background: rgba(20,24,22,0.96);
    border-top: 1px solid var(--border);
    padding: 7px 14px 7px 18px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    gap: 18px;
    flex-wrap: nowrap;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
}
#statbar span { white-space: nowrap; flex-shrink: 0; }
#statbar b { color: var(--accent2); }
#statbar .close-traj {
    margin-left: auto;
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
    transition: color 0.15s;
}
#statbar .close-traj:hover { color: var(--accent2); }

/* ── Map ── */
#map {
    grid-area: map;
    background: #0a0c0b;
    position: relative;
}
.leaflet-control-attribution { display:none !important; }
.leaflet-control-zoom a { background: var(--bg2) !important; color: var(--accent2) !important; border-color: var(--border) !important; }
.leaflet-control-zoom a:hover { background: var(--bg3) !important; }
.leaflet-tooltip-own {
    background: var(--bg2); border: 1px solid var(--accent); border-radius: 4px;
    color: var(--text); font-family: var(--mono); font-size: 11px;
    padding: 6px 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.6); pointer-events: none;
}

/* ── Sidebar shell ── */
#sidebar {
    grid-area: sidebar;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* ── Two panels inside sidebar: zones | particles ── */
.sidebar-panels {
    display: flex;
    width: 200%;         /* two panels side by side at 50% each = sidebar width */
    flex: 1;
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.sidebar-panels.show-particles {
    transform: translateX(-50%);
}
.panel {
    width: 50%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
}

/* ── Shared sidebar elements ── */
.sidebar-top {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
}
.metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
}
.metric {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
}
.metric .val { font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--accent2); line-height: 1; }
.metric .lbl { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 2px; }

/* ── Colorbar ── */
.cb-block { padding: 8px 14px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.cb-gradient { height: 7px; border-radius: 4px; background: linear-gradient(90deg,#1a2a0a,#4a6a15,#899b2f,#b8cc3f,#ddf060); margin: 5px 0 3px; }
.cb-ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); }

/* ── Chart toggle ── */
.chart-toggle { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.toggle-btn {
    font-family: var(--mono); font-size: 10px; padding: 4px 10px;
    border-radius: 3px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.06em;
}
.toggle-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Scrollable lists ── */
.scroll-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 12px;
}
.scroll-list::-webkit-scrollbar { width: 3px; }
.scroll-list::-webkit-scrollbar-track { background: var(--bg2); }
.scroll-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Zone bar rows ── */
.bar-row {
    margin-bottom: 8px; cursor: pointer; border-radius: 3px;
    padding: 6px 8px; transition: background 0.12s;
    border: 1px solid transparent;
}
.bar-row:hover { background: var(--bg3); border-color: var(--border); }
.bar-row.active { background: var(--bg3); border-color: var(--accent) !important; }
.bar-name { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; margin-bottom: 3px; }
.bar-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.bar-track { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.bar-fill-mpw { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:3px; transition:width 0.4s cubic-bezier(0.25,1,0.5,1); }
.bar-fill-count { height:100%; background:linear-gradient(90deg,var(--blue2),var(--blue)); border-radius:3px; transition:width 0.4s cubic-bezier(0.25,1,0.5,1); }
.bar-labels { display:flex; justify-content:space-between; margin-top:3px; }
.bar-val { font-family:var(--mono); font-size:11px; color:var(--accent2); }
.bar-val.blue { color:var(--blue); }

/* ── Particle panel header ── */
.panel-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.back-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 3px;
    color: var(--muted); font-family: var(--mono); font-size: 10px;
    padding: 4px 8px; cursor: pointer; letter-spacing: 0.06em; transition: all 0.12s;
}
.back-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.panel-title { font-size: 10px; font-weight: 700; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.particle-count-badge {
    font-family: var(--mono); font-size: 11px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 2px 7px; color: var(--muted); white-space: nowrap;
}

/* ── Zone summary strip ── */
.zone-summary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.zs-item { font-family: var(--mono); font-size: 10px; }
.zs-val { color: var(--accent2); font-weight: 500; }
.zs-lbl { color: var(--muted); font-size: 11px; margin-top: 1px; }

/* ── Particle rows ── */
.ptcl-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.1s;
    margin-bottom: 4px;
}
.ptcl-row:hover { background: var(--bg3); border-color: var(--border); }
.ptcl-row.active { background: var(--bg3); border-color: var(--accent); }
.ptcl-pid {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--accent2); min-width: 52px;
}
.ptcl-details { flex: 1; min-width: 0; }
.ptcl-main { font-family: var(--mono); font-size: 10px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptcl-sub  { font-family: var(--mono); font-size: 9px;  color: var(--muted); margin-top: 1px; }
.ptcl-mpw  { font-family: var(--mono); font-size: 11px; color: var(--accent2); text-align: right; white-space: nowrap; }

/* ── Layers menu ── */
.layers-wrap { position: relative; }
.layers-btn {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); padding: 5px 11px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s; white-space: nowrap;
}
.layers-btn:hover, .layers-btn.open {
    border-color: var(--accent2); color: var(--accent2);
}
.layers-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px); left: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px 0;
    min-width: 170px;
    z-index: 2000;
    box-shadow: 0 8px 28px rgba(0,0,0,0.55);
}
.layers-menu.open { display: block; }
.lm-section-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    padding: 2px 14px 6px; pointer-events: none;
}
.lm-divider { border-top: 1px solid var(--border); margin: 8px 0; }
.lm-radio, .lm-check {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--text);
    padding: 5px 14px; cursor: pointer; transition: background 0.1s;
}
.lm-radio:hover, .lm-check:hover { background: var(--bg3); }
.lm-radio input, .lm-check input { accent-color: var(--accent2); cursor: pointer; }
</style>
</head>
<body>

<header>
    <h1>🐢 Nesting Zone Explorer</h1>
    <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">January 2011</span>

    <!-- ── Custom layers menu ── -->
    <div class="layers-wrap" id="layersWrap">
        <button class="layers-btn" id="layersBtn" onclick="toggleLayersMenu(event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            Layers
        </button>
        <div class="layers-menu" id="layersMenu">
            <div class="lm-section-label">Basemap</div>
            <label class="lm-radio"><input type="radio" name="basemap" value="dark"      checked onchange="setBasemap(this.value)"> Dark</label>
            <label class="lm-radio"><input type="radio" name="basemap" value="satellite"        onchange="setBasemap(this.value)"> Satellite</label>
            <label class="lm-radio"><input type="radio" name="basemap" value="street"           onchange="setBasemap(this.value)"> Street</label>
            <label class="lm-radio"><input type="radio" name="basemap" value="topo"             onchange="setBasemap(this.value)"> Topo</label>
            <div class="lm-divider"></div>
            <div class="lm-section-label">Overlays</div>
            <label class="lm-check"><input type="checkbox" id="chkZones"     checked onchange="toggleOverlay('zones',     this.checked)"> Nesting Zones</label>
            <label class="lm-check"><input type="checkbox" id="chkTraj"      checked onchange="toggleOverlay('traj',      this.checked)"> Trajectory</label>
            <label class="lm-check"><input type="checkbox" id="chkPoints"    checked onchange="toggleOverlay('points',    this.checked)"> Day Points</label>
            <label class="lm-check"><input type="checkbox" id="chkLow"             onchange="toggleOverlay('low',       this.checked)"> Low Movement</label>
            <label class="lm-check"><input type="checkbox" id="chkMarkers"   checked onchange="toggleOverlay('markers',   this.checked)"> Markers</label>
        </div>
    </div>

    <div class="header-pills">
        <div class="pill">particles <span>14,465</span></div>
        <div class="pill">frozen <span>10,429</span></div>
        <div class="pill">in nesting <span>7</span></div>
        <div class="pill">zones <span>7</span></div>
        <div class="pill">total MPW <span>3.237 t</span></div>
    </div>
</header>

<div id="map">
    <div id="statbar">
        <!-- filled by JS when a trajectory is active -->
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-panels" id="panels">

        <!-- ══ PANEL 1: Zone choropleth + bar chart ══ -->
        <div class="panel" id="panelZones">
            <div class="sidebar-top">
                <div class="section-label">Overview</div>
                <div class="metrics">
                    <div class="metric"><div class="val">3.237</div><div class="lbl">total MPW (t)</div></div>
                    <div class="metric"><div class="val">7</div><div class="lbl">particles in nesting</div></div>
                    <div class="metric"><div class="val">7</div><div class="lbl">active zones</div></div>
                    <div class="metric"><div class="val">0.4624</div><div class="lbl">mean MPW/particle</div></div>
                </div>
            </div>

            <div class="cb-block">
                <div class="section-label" style="margin-bottom:0">MPW intensity (tons)</div>
                <div class="cb-gradient"></div>
                <div class="cb-ticks" id="cbTicks"></div>
            </div>

            <div class="chart-toggle">
                <button class="toggle-btn active" id="btnMpw"   onclick="setMode('mpw')">Total MPW</button>
                <button class="toggle-btn"        id="btnCount" onclick="setMode('count')">Particle Count</button>
            </div>

            <div class="scroll-list" id="zoneList"></div>
        </div>

        <!-- ══ PANEL 2: Particle list for selected zone ══ -->
        <div class="panel" id="panelParticles">
            <div class="panel-header">
                <button class="back-btn" onclick="goBack()">← Zones</button>
                <div class="panel-title" id="panelTitle">—</div>
                <div class="particle-count-badge" id="panelBadge">0</div>
            </div>
            <div class="zone-summary" id="zoneSummary"></div>
            <div class="scroll-list" id="particleList"></div>
        </div>
    </div>
</div>

const MPW_PAL = [[0,[26,42,10]],[0.25,[74,106,21]],[0.5,[137,155,47]],[0.75,[184,204,63]],[1,[221,240,96]]];
function scaleColor(t) {
    t = Math.max(0,Math.min(1,t));
    let i=0;
    for(let s=1;s<MPW_PAL.length;s++){ if(t<=MPW_PAL[s][0]){i=s-1;break;} if(s===MPW_PAL.length-1)i=s-1; }
    const [t0,c0]=MPW_PAL[i],[t1,c1]=MPW_PAL[i+1], f=(t-t0)/(t1-t0);
    return `rgb(${Math.round(c0[0]+f*(c1[0]-c0[0]))},${Math.round(c0[1]+f*(c1[1]-c0[1]))},${Math.round(c0[2]+f*(c1[2]-c0[2]))})`;
}

const TRAJ_PAL = [[0,[13,8,135]],[0.2,[106,0,168]],[0.4,[177,42,144]],[0.6,[225,100,98]],[0.8,[252,166,54]],[1,[240,249,33]]];
function dayColor(d, maxD) {
    const t=Math.min(d/Math.max(maxD,1),1);
    let i=0;
    for(let s=1;s<TRAJ_PAL.length;s++){ if(t<=TRAJ_PAL[s][0]){i=s-1;break;} if(s===TRAJ_PAL.length-1)i=s-1; }
    const [t0,c0]=TRAJ_PAL[i],[t1,c1]=TRAJ_PAL[i+1], f=(t-t0)/(t1-t0);
    return `rgb(${Math.round(c0[0]+f*(c1[0]-c0[0]))},${Math.round(c0[1]+f*(c1[1]-c0[1]))},${Math.round(c0[2]+f*(c1[2]-c0[2]))})`;
}

const pidMap   = {};  PARTICLES.forEach(p=>{ pidMap[p.pid]=p; });

};
const darkLabels = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{attribution:'',pane:'overlayPane',zIndex:650});
let currentBasemap = 'dark';
basemaps.dark.addTo(map);
darkLabels.addTo(map);

function setBasemap(name) {
    Object.values(basemaps).forEach(l => map.removeLayer(l));
    basemaps[name].addTo(map);
    basemaps[name].bringToBack();
    // Dark labels only look right on the dark basemap
    if (name === 'dark') { if (!map.hasLayer(darkLabels)) darkLabels.addTo(map); }
    else { map.removeLayer(darkLabels); }
    currentBasemap = name;
}

// Draw zone cells
const cellLayers = {};
CELLS.forEach(cell => {
    const z   = zoneMap[cell.beach]||null;
    const t   = z ? z.mpw_total/maxMpw : 0;
    const col = scaleColor(t);
    const tip = z
        ? `<b>${cell.beach}</b><br>MPW: <b>${z.mpw_total} t</b><br>Particles: <b>${z.count}</b><br>Mean MPW: ${z.mpw_mean} t<br>Mean drift: ${z.dur_mean} d`
        : `<b>${cell.beach}</b><br><span style="color:#7a8a7d">No arrivals</span>`;
    const rect = L.rectangle([[cell.miny,cell.minx],[cell.maxy,cell.maxx]],{
        color:col, fillColor:col, fillOpacity: z ? 0.35+0.5*t : 0.1, weight: z ? 1.5 : 0.5
    })
    .bindTooltip(tip,{className:'leaflet-tooltip-own',sticky:true})
    .on('click',()=>{ if(z) openZone(z.beach); })
    .addTo(zoneCellLayer);
    cellLayers[cell.beach]=rect;
});

// ── State ────────────────────────────────────────────────────────────────
let activeZone    = null;
let activeParticle = null;
let chartMode     = 'mpw';

// ── Zone list (panel 1) ──────────────────────────────────────────────────
function setMode(mode) {
    chartMode=mode;
    document.getElementById('btnMpw').classList.toggle('active',  mode==='mpw');
    document.getElementById('btnCount').classList.toggle('active',mode==='count');
    renderZoneList();
}

function renderZoneList() {
    const sorted=[...ZONES].sort((a,b)=> chartMode==='mpw' ? b.mpw_total-a.mpw_total : b.count-a.count);
    const maxVal = chartMode==='mpw' ? maxMpw : maxCount;
    document.getElementById('zoneList').innerHTML = sorted.map((z,i) => {
        const pct  = (z[chartMode==='mpw'?'mpw_total':'count']/maxVal*100).toFixed(1);
        const isMpw= chartMode==='mpw';
        const val  = isMpw ? `${z.mpw_total} t` : `${z.count} particles`;
        const sub  = isMpw
            ? `${z.count} particles · ${z.mpw_mean} t mean · ${z.dur_mean} d drift`
            : `${z.mpw_total} t total · ${z.dur_mean} d drift`;
        const active = z.beach===activeZone ? ' active' : '';
        return `<div class="bar-row${active}" data-beach="${i}" >
            <div class="bar-name">${z.beach}</div>
            <div class="bar-sub">${sub}</div>
            <div class="bar-track"><div class="${isMpw?'bar-fill-mpw':'bar-fill-count'}" style="width:${pct}%"></div></div>
            <div class="bar-labels">
                <div class="bar-val${isMpw?'':' blue'}">${val}</div>
                <div class="bar-val" style="color:var(--muted)">#${i+1}</div>
            </div>
        </div>`;
    }).join('');
}

// ── Zone list click via event delegation (avoids beach-name string escaping) ──
document.getElementById('zoneList').addEventListener('click', e => {
    const row = e.target.closest('.bar-row');
    if (!row) return;
    const sorted = [...ZONES].sort((a,b) => chartMode==='mpw' ? b.mpw_total-a.mpw_total : b.count-a.count);
    const idx = parseInt(row.dataset.beach, 10);
    if (!isNaN(idx) && sorted[idx]) openZone(sorted[idx].beach);
});

// ── Open zone → slide to panel 2 ────────────────────────────────────────
function openZone(beach) {
    activeZone = beach;
    activeParticle = null;
    renderZoneList();

    // Highlight cell on map
    highlightZoneCell(beach);

    // Fly to cell
    const cell = CELLS.find(c=>c.beach===beach);
    if(cell) map.flyToBounds([[cell.miny,cell.minx],[cell.maxy,cell.maxx]],{maxZoom:9,duration:0.5,padding:[30,30]});

    // Fill panel 2
    const z = zoneMap[beach];
    document.getElementById('panelTitle').textContent = beach;
    document.getElementById('panelBadge').textContent = z.count + ' particles';
    document.getElementById('zoneSummary').innerHTML = `
        <div class="zs-item"><div class="zs-val">${z.mpw_total} t</div><div class="zs-lbl">total MPW</div></div>
        <div class="zs-item"><div class="zs-val">${z.mpw_mean} t</div><div class="zs-lbl">mean MPW</div></div>
        <div class="zs-item"><div class="zs-val">${z.dur_mean} d</div><div class="zs-lbl">mean drift</div></div>
    `;

    // Sort particles for this zone by mpw_end desc
    const zonePids = z.pids;
    const zParts   = zonePids.map(pid=>pidMap[pid]).filter(Boolean)
                             .sort((a,b)=>(b.mpw_end||0)-(a.mpw_end||0));

    document.getElementById('particleList').innerHTML = zParts.map(p => {
        const mpwTxt = p.mpw_end !== null ? `${p.mpw_end} t` : '—';
        const active = p.pid===activeParticle ? ' active' : '';
        return `<div class="ptcl-row${active}" id="prow-${p.pid}" onclick="loadTrajectory(${p.pid})">
            <div class="ptcl-pid">#${p.pid}</div>
            <div class="ptcl-details">
                <div class="ptcl-main">${p.duration} days · ${p.total_dist} km</div>
                <div class="ptcl-sub">Start: ${p.start_lat_str}, ${p.start_lon_str}</div>
            </div>
            <div class="ptcl-mpw">${mpwTxt}</div>
        </div>`;
    }).join('');

    // Slide to panel 2
    document.getElementById('panels').classList.add('show-particles');
}

// ── Back to zones ────────────────────────────────────────────────────────
function goBack() {
    clearTrajectory();
    document.getElementById('panels').classList.remove('show-particles');
    activeZone = null;
    activeParticle = null;
    renderZoneList();
    resetCellStyles();
}

// ── Load trajectory ──────────────────────────────────────────────────────
function clearTrajectory() {
    trajLayer.clearLayers();
    pointsLayer.clearLayers();
    lowLayer.clearLayers();
    markersLayer.clearLayers();
    document.getElementById('statbar').style.display = 'none';
}

function loadTrajectory(pid) {
    clearTrajectory();
    activeParticle = pid;

    // Update active row styling
    document.querySelectorAll('.ptcl-row').forEach(r => r.classList.remove('active'));
    const row = document.getElementById('prow-'+pid);
    if(row) { row.classList.add('active'); row.scrollIntoView({behavior:'smooth',block:'nearest'}); }

    const p    = pidMap[pid];
    const maxD = p.duration;

    // Trajectory polyline segments
    for(let i=0;i<p.traj.length-1;i++) {
        const [lat1,lon1,d1]=p.traj[i],[lat2,lon2]=p.traj[i+1];
        L.polyline([[lat1,lon1],[lat2,lon2]],{color:dayColor(d1,maxD),weight:3,opacity:0.85}).addTo(trajLayer);
    }

    // Day points
    p.points.forEach(pt=>{
        const col=dayColor(pt.d,maxD);
        const tip=`<b>Day ${pt.d}</b><br>Lat:${pt.lat} Lon:${pt.lon}<br>Daily:${pt.dist} km · Cum:${pt.cum} km`+(pt.low?'<br>⚠ LOW MOVEMENT':'');
        L.circleMarker([pt.lat,pt.lon],{radius:4,color:col,fillColor:col,fillOpacity:0.9}).bindTooltip(tip,{className:'leaflet-tooltip-own'}).addTo(pointsLayer);
        if(pt.low) L.circleMarker([pt.lat,pt.lon],{radius:6,color:'#fff',fillColor:'#fff',fillOpacity:0.5}).addTo(lowLayer);
    });

    // Start / end markers
    L.marker([p.start_lat,p.start_lon],{
        icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',iconSize:[25,41],iconAnchor:[12,41]})
    }).bindTooltip(`<b>START Day 0</b><br>${p.start_lat_str}, ${p.start_lon_str}`,{className:'leaflet-tooltip-own'}).addTo(markersLayer);

    const wtxt = p.mpw_end!==null?`<br>MPW: ${p.mpw_end} t`:'';
    L.marker([p.end_lat,p.end_lon],{
        icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',iconSize:[25,41],iconAnchor:[12,41]})
    }).bindTooltip(`<b>FROZEN Day ${p.freeze_end_day}</b><br>${p.end_lat_str}, ${p.end_lon_str}${wtxt}`,{className:'leaflet-tooltip-own'}).addTo(markersLayer);

    // Fit map bounds
    const lats=p.traj.map(t=>t[0]),lons=p.traj.map(t=>t[1]);
    map.fitBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]],{padding:[40,80]});

    // Stat bar
    const mpwTxt = p.mpw_end!==null ? `<b>${p.mpw_end}</b> t (start <b>${p.mpw_start}</b> t)` : '—';
    const sb = document.getElementById('statbar');
    sb.innerHTML = `
        <span>Particle <b>#${p.pid}</b></span>
        <span>Duration <b>${p.duration}</b> d</span>
        <span>Distance <b>${p.total_dist}</b> km</span>
        <span>Low-mvmt <b>${p.low_days}</b> d</span>
        <span>MPW ${mpwTxt}</span>
        <span>End ${p.end_lat_str}, ${p.end_lon_str}</span>
        <button class="close-traj" onclick="clearTrajectory()" title="Clear trajectory">✕</button>`;
    sb.style.display='flex';
}

// ── Cell highlight helpers ───────────────────────────────────────────────
function highlightZoneCell(beach) {
    Object.entries(cellLayers).forEach(([b,layer])=>{
        const z=zoneMap[b], t=z?z.mpw_total/maxMpw:0, col=scaleColor(t);
        if(b===beach) {
            layer.setStyle({color:'#ddf060',fillColor:'#ddf060',weight:3,fillOpacity:0.7});
            layer.bringToFront();
        } else {
            layer.setStyle({color:col,fillColor:col,weight:z?1.5:0.5,fillOpacity:z?0.35+0.5*t:0.1});
        }
    });
}

function resetCellStyles() {
    Object.entries(cellLayers).forEach(([b,layer])=>{
        const z=zoneMap[b], t=z?z.mpw_total/maxMpw:0, col=scaleColor(t);
        layer.setStyle({color:col,fillColor:col,weight:z?1.5:0.5,fillOpacity:z?0.35+0.5*t:0.1});
    });
}

// ── Init ─────────────────────────────────────────────────────────────────
renderZoneList();
</script>
