<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nesting Zone MPW Summary — January 2011 – July 2021</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
    --bg:       #0d0f0e;
    --bg2:      #141816;
    --bg3:      #1c211e;
    --border:   #2a302c;
    --accent:   #899b2f;
    --accent2:  #b8cc3f;
    --text:     #e8ede9;
    --muted:    #7a8a7d;
    --danger:   #e86f4a;
    --mono:     'DM Mono', monospace;
    --sans:     'Syne', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: 52px 1fr;
    grid-template-columns: 1fr 340px;
    grid-template-areas:
        "header header"
        "map    sidebar";
}

/* ── Header ── */
header {
    grid-area: header;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 20px;
}
header h1 {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent2);
}
header .subtitle {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
}
.header-pills {
    margin-left: auto;
    display: flex;
    gap: 8px;
}
.pill {
    font-family: var(--mono);
    font-size: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 3px 8px;
    color: var(--muted);
}
.pill span {
    color: var(--accent2);
    font-weight: 500;
}

/* ── Map ── */
#map {
    grid-area: map;
    background: #0a0c0b;
}
.leaflet-control-attribution { display:none !important; }
.leaflet-control-zoom a {
    background: var(--bg2) !important;
    color: var(--accent2) !important;
    border-color: var(--border) !important;
}
.leaflet-control-zoom a:hover { background: var(--bg3) !important; }

/* ── Sidebar ── */
#sidebar {
    grid-area: sidebar;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
}
.section-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
}

/* ── Metric grid ── */
.metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.metric {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
}
.metric .val {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--accent2);
    line-height: 1;
}
.metric .lbl {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.06em;
}

/* ── Chart ── */
#chart-wrap {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 16px;
}
#chart-wrap::-webkit-scrollbar { width: 4px; }
#chart-wrap::-webkit-scrollbar-track { background: var(--bg2); }
#chart-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.bar-row {
    margin-bottom: 10px;
    cursor: pointer;
    border-radius: 3px;
    padding: 6px 8px;
    transition: background 0.15s;
    border: 1px solid transparent;
}
.bar-row:hover, .bar-row.active {
    background: var(--bg3);
    border-color: var(--border);
}
.bar-row.active { border-color: var(--accent); }

.bar-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 280px;
    margin-bottom: 4px;
}
.bar-sub {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 5px;
}
.bar-track {
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
}
.bar-fill-mpw {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.25,1,0.5,1);
}
.bar-fill-count {
    height: 100%;
    background: linear-gradient(90deg, #4a7a8a, #6ab8cc);
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.25,1,0.5,1);
}
.bar-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 3px;
}
.bar-val {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--accent2);
}
.bar-val.blue { color: #6ab8cc; }

/* ── Toggle ── */
.chart-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
}
.toggle-btn {
    font-family: var(--mono);
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.06em;
}
.toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}

/* ── Tooltip ── */
.leaflet-tooltip-own {
    background: var(--bg2);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    pointer-events: none;
}

/* ── Colorbar ── */
#colorbar {
    padding: 10px 16px 12px;
    border-bottom: 1px solid var(--border);
}
.cb-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
}
.cb-gradient {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(90deg, #1a2a0a, #4a6a15, #899b2f, #b8cc3f, #ddf060);
}
.cb-ticks {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 8px;
    color: var(--muted);
    margin-top: 3px;
}
</style>
</head>

</div>

// ── Colour scale: low→high MPW ──────────────────────────────────────────
const MPW_PALETTE = [
    [0.00, [26,  42, 10]],
    [0.25, [74, 106, 21]],
    [0.50, [137,155, 47]],
    [0.75, [184,204, 63]],
    [1.00, [221,240, 96]],
];

function scaleColor(t) {
    t = Math.max(0, Math.min(1, t));
    let i = 0;
    for (let s = 1; s < MPW_PALETTE.length; s++) {
        if (t <= MPW_PALETTE[s][0]) { i = s-1; break; }
        if (s === MPW_PALETTE.length-1) i = s-1;
    }
    const [t0,c0] = MPW_PALETTE[i], [t1,c1] = MPW_PALETTE[i+1];
    const f = (t-t0)/(t1-t0);
    const r = Math.round(c0[0]+f*(c1[0]-c0[0]));
    const g = Math.round(c0[1]+f*(c1[1]-c0[1]));
    const b = Math.round(c0[2]+f*(c1[2]-c0[2]));
    return `rgb(${r},${g},${b})`;
}

// ── Build lookup maps ────────────────────────────────────────────────────
const maxMpw    = Math.max(...STATS.map(s => s.mpw_total), 0.001);
const maxCount  = Math.max(...STATS.map(s => s.count), 1);
const statsByBeach = {};
STATS.forEach(s => { statsByBeach[s.beach] = s; });

// ── Colorbar ticks ───────────────────────────────────────────────────────
const ticks = [0, 0.25, 0.5, 0.75, 1.0].map(t => (t * maxMpw).toFixed(3));
document.getElementById('cbTicks').innerHTML = ticks.map(v => `<span>${v}</span>`).join('');

// ── Map ──────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:true, preferCanvas:true}).setView([26, -79], 6);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
    {attribution:''}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',
    {attribution:'', pane:'overlayPane', zIndex:650}).addTo(map);

// Draw nesting cell rectangles
const cellLayers = {};   // beach -> Leaflet layer

CELLS.forEach(cell => {
    const s   = statsByBeach[cell.beach] || null;
    const t   = s ? s.mpw_total / maxMpw : 0;
    const col = scaleColor(t);
    const opacity = s ? 0.35 + 0.5 * t : 0.12;

    const tooltip = s
        ? `<b>${cell.beach}</b><br>` +
          `MPW: <b>${s.mpw_total} t</b><br>` +
          `Particles: <b>${s.count}</b><br>` +
          `Mean MPW: ${s.mpw_mean} t<br>` +
          `Mean drift: ${s.dur_mean} days`
        : `<b>${cell.beach}</b><br><span style="color:#7a8a7d">No arrivals</span>`;

    const rect = L.rectangle(
        [[cell.miny, cell.minx],[cell.maxy, cell.maxx]],
        {
            color:       col,
            fillColor:   col,
            fillOpacity: opacity,
            weight:      s ? 1.5 : 0.5,
        }
    )
    .bindTooltip(tooltip, {className:'leaflet-tooltip-own', sticky:true})
    .on('click', () => { if (s) selectBeach(s.beach); })
    .addTo(map);

    cellLayers[cell.beach] = rect;
});

// ── Chart ────────────────────────────────────────────────────────────────
let chartMode    = 'mpw';
let activeBeach  = null;

function setMode(mode) {
    chartMode = mode;
    document.getElementById('btnMpw').classList.toggle('active',   mode==='mpw');
    document.getElementById('btnCount').classList.toggle('active', mode==='count');
    renderChart();
}

function renderChart() {
    const wrap   = document.getElementById('chart-wrap');
    const sorted = [...STATS].sort((a,b) =>
        chartMode === 'mpw' ? b.mpw_total - a.mpw_total : b.count - a.count
    );
    const maxVal = chartMode === 'mpw' ? maxMpw : maxCount;

    wrap.innerHTML = sorted.map((s, i) => {
        const pct    = (s[chartMode === 'mpw' ? 'mpw_total' : 'count'] / maxVal * 100).toFixed(1);
        const isMpw  = chartMode === 'mpw';
        const val    = isMpw ? `${s.mpw_total} t` : `${s.count} particles`;
        const sub    = isMpw
            ? `${s.count} particles · mean ${s.mpw_mean} t · ${s.dur_mean} d drift`
            : `${s.mpw_total} t total · mean ${s.dur_mean} d · ${s.dist_mean} km`;
        const isActive = s.beach === activeBeach ? ' active' : '';
        return `
        <div class="bar-row${isActive}" id="bar-${i}" onclick="selectBeach('${s.beach.replace(/'/g,"\'")}')">
            <div class="bar-name">${s.beach}</div>
            <div class="bar-sub">${sub}</div>
            <div class="bar-track">
                <div class="${isMpw ? 'bar-fill-mpw' : 'bar-fill-count'}" style="width:${pct}%"></div>
            </div>
            <div class="bar-labels">
                <div class="bar-val${isMpw ? '' : ' blue'}">${val}</div>
                <div class="bar-val" style="color:var(--muted)">#${i+1}</div>
            </div>
        </div>`;
    }).join('');
}

function selectBeach(beach) {
    activeBeach = beach;
    renderChart();

    // Scroll chart row into view
    const rows = document.querySelectorAll('.bar-row');
    rows.forEach(r => {
        if (r.querySelector('.bar-name') && r.querySelector('.bar-name').textContent === beach) {
            r.scrollIntoView({behavior:'smooth', block:'nearest'});
        }
    });

    // Highlight map cell
    Object.entries(cellLayers).forEach(([b, layer]) => {
        const s = statsByBeach[b];
        const t = s ? s.mpw_total / maxMpw : 0;
        if (b === beach) {
            layer.setStyle({weight:3, color:'#ddf060', fillOpacity: 0.75});
            layer.bringToFront();
        } else {
            const col = scaleColor(t);
            layer.setStyle({weight: s ? 1.5 : 0.5, color:col, fillColor:col, fillOpacity: s ? 0.35+0.5*t : 0.12});
        }
    });

    // Fly to cell
    const cell = CELLS.find(c => c.beach === beach);
    if (cell) {
        map.flyToBounds(
            [[cell.miny, cell.minx],[cell.maxy, cell.maxx]],
            {maxZoom:9, duration:0.6, padding:[40,40]}
        );
    }
}

renderChart();
