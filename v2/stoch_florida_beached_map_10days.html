  .panel-title { font-size:13px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--accent); }

  .layer-toggle input:checked + .toggle-track { background:var(--accent); }
  .layer-toggle input:checked + .toggle-track::after { background:#fff; left:18px; }
  .toggle-label { font-size:13px; font-weight:500; } .toggle-sub { font-size:11px; color:var(--text-secondary); }
  .slider-group { margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06); }

  .slider-value { font-family:'JetBrains Mono',monospace; color:var(--accent); font-size:11px; }
  input[type="range"] { -webkit-appearance:none; width:100%; height:4px; border-radius:2px; background:#2a3a4a; outline:none; }

<body>
<div id="map"></div>
<div class="panel" id="controlPanel">

    <span class="panel-title">Stochastic (D=10d)</span><span class="panel-toggle">&#9660;</span>
  </div>
  <div class="panel-body">
    <div class="layer-section"><div class="layer-section-label">Heatmaps</div>
      <label class="layer-toggle"><input type="checkbox" id="togMpwHeat" checked><span class="toggle-track"></span><span><span class="toggle-label">MPW Heatmap</span><br><span class="toggle-sub">Weight-based gradient</span></span></label>
      <label class="layer-toggle"><input type="checkbox" id="togDensityHeat"><span class="toggle-track"></span><span><span class="toggle-label">Density Heatmap</span><br><span class="toggle-sub">Particle count gradient</span></span></label>
    </div>
    <div class="layer-section"><div class="layer-section-label">Overlays</div>
      <label class="layer-toggle"><input type="checkbox" id="togDots"><span class="toggle-track"></span><span><span class="toggle-label">Particle Endpoints</span><br><span class="toggle-sub">Individual markers</span></span></label>
    </div>
    <div class="slider-group">
      <div class="slider-row"><div class="slider-label"><span>Heatmap Radius</span><span class="slider-value" id="radiusVal">25</span></div><input type="range" id="radiusSlider" min="5" max="60" value="25"></div>
      <div class="slider-row"><div class="slider-label"><span>Heatmap Blur</span><span class="slider-value" id="blurVal">15</span></div><input type="range" id="blurSlider" min="1" max="40" value="15"></div>
      <div class="slider-row"><div class="slider-label"><span>Intensity Cap (pctl)</span><span class="slider-value" id="capVal">75</span></div><input type="range" id="capSlider" min="10" max="100" value="75"></div>
      <div class="slider-row"><div class="slider-label"><span>Dot Opacity</span><span class="slider-value" id="dotOpacityVal">0.6</span></div><input type="range" id="dotOpacitySlider" min="10" max="100" value="60"></div>
    </div>
    <div class="year-filters"><div class="layer-section-label">Filter by Year</div><div class="year-pills" id="yearPills"></div></div>
    <div class="download-section"><div class="layer-section-label">Export</div><div class="download-btns">
      <button class="download-btn" onclick="downloadShapefile()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download Shapefile (.zip)</button>
      <button class="download-btn" onclick="downloadGeoJSON()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download Filtered GeoJSON</button>
    </div></div>
  </div>
</div>
<div class="legend" id="legend">
  <div class="legend-title" id="legendTitle">MPW Intensity</div>
  <div class="legend-gradient" id="legendGradient" style="background:linear-gradient(to right,#0a1628,#003344,#00887a,#899b2f,#ffc145,#ff6b6b);"></div>
  <div class="legend-labels"><span>Low</span><span>High</span></div>
</div>

  <div class="stat-item"><div class="stat-value" id="statYears">&mdash;</div><div class="stat-label">Years</div></div>
</div>

const allParticles = MAP_DATA.particles || [];
const stats = MAP_DATA.stats || {};
let activeYears = new Set();
let mpwHeatLayer=null, densityHeatLayer=null, dotsLayer=null;
const ACCENT = "#899b2f";

const map = L.map("map", {center:[27.8,-83.0],zoom:7,zoomControl:false});
L.control.zoom({position:"topright"}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {attribution:'&copy; OSM &copy; CARTO',subdomains:"abcd",maxZoom:19}).addTo(map);

(function init(){
  const years=[...new Set(allParticles.map(p=>p.year))].sort();
  activeYears=new Set(years);
  const pillsEl=document.getElementById("yearPills");
  const allPill=document.createElement("span"); allPill.className="year-pill active"; allPill.textContent="All";
  allPill.onclick=()=>{activeYears=new Set(years);updatePills();rebuildLayers();};
  pillsEl.appendChild(allPill);
  years.forEach(y=>{
    const pill=document.createElement("span"); pill.className="year-pill active"; pill.dataset.year=y; pill.textContent=y;
    pill.onclick=()=>{if(activeYears.has(y))activeYears.delete(y);else activeYears.add(y);updatePills();rebuildLayers();};
    pillsEl.appendChild(pill);
  });
  updateStatsBar(allParticles); rebuildLayers();
  if(allParticles.length>0){
    const lats=allParticles.map(p=>p.lat),lons=allParticles.map(p=>p.lon);
    map.fitBounds([[Math.min(...lats)-0.3,Math.min(...lons)-0.3],[Math.max(...lats)+0.3,Math.max(...lons)+0.3]]);
  }
  ["togMpwHeat","togDensityHeat","togDots"].forEach(id=>document.getElementById(id).addEventListener("change",rebuildLayers));
  document.getElementById("radiusSlider").addEventListener("input",e=>{document.getElementById("radiusVal").textContent=e.target.value;rebuildHeatmaps();});
  document.getElementById("blurSlider").addEventListener("input",e=>{document.getElementById("blurVal").textContent=e.target.value;rebuildHeatmaps();});
  document.getElementById("capSlider").addEventListener("input",e=>{document.getElementById("capVal").textContent=e.target.value;rebuildHeatmaps();rebuildDots();});
  document.getElementById("dotOpacitySlider").addEventListener("input",e=>{document.getElementById("dotOpacityVal").textContent=(e.target.value/100).toFixed(2);rebuildDots();});
})();

function updatePills(){const pills=document.querySelectorAll(".year-pill");const years=[...new Set(allParticles.map(p=>p.year))].sort();pills.forEach(pill=>{if(pill.textContent==="All")pill.classList.toggle("active",activeYears.size===years.length);else pill.classList.toggle("active",activeYears.has(parseInt(pill.dataset.year)));});}
function getFiltered(){return allParticles.filter(p=>activeYears.has(p.year));}
function percentile(arr,pct){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);return s[Math.max(0,Math.ceil((pct/100)*s.length)-1)];}

function updateStatsBar(pts){
  document.getElementById("statParticles").textContent=pts.length.toLocaleString();
  document.getElementById("statMpw").textContent=pts.reduce((s,p)=>s+p.mpw,0).toFixed(2);
  const avgConf=pts.length>0?pts.reduce((s,p)=>s+p.best_bin_pct,0)/pts.length:0;
  document.getElementById("statAvgConf").textContent=avgConf.toFixed(1)+"%";
  const years=[...new Set(pts.map(p=>p.year))].sort();
  document.getElementById("statYears").textContent=years.length>1?years[0]+"\u2013"+years[years.length-1]:(years[0]||"\u2014");
}
function rebuildLayers(){rebuildHeatmaps();rebuildDots();updateStatsBar(getFiltered());}

function rebuildHeatmaps(){
  const pts=getFiltered();const radius=parseInt(document.getElementById("radiusSlider").value);
  const blur=parseInt(document.getElementById("blurSlider").value);const capPct=parseInt(document.getElementById("capSlider").value);
  if(mpwHeatLayer){map.removeLayer(mpwHeatLayer);mpwHeatLayer=null;}
  if(document.getElementById("togMpwHeat").checked&&pts.length>0){
    const vals=pts.filter(p=>p.mpw>0).map(p=>p.mpw);const mx=Math.max(percentile(vals,capPct),0.001);
    mpwHeatLayer=L.heatLayer(pts.filter(p=>p.mpw>0).map(p=>[p.lat,p.lon,Math.min(p.mpw/mx,1.0)]),
      {radius,blur,maxZoom:17,max:1.0,gradient:{0.0:"#0a1628",0.2:"#003344",0.4:"#00887a",0.6:ACCENT,0.8:"#ffc145",1.0:"#ff6b6b"}}).addTo(map);
  }
  if(densityHeatLayer){map.removeLayer(densityHeatLayer);densityHeatLayer=null;}
  if(document.getElementById("togDensityHeat").checked&&pts.length>0){
    densityHeatLayer=L.heatLayer(pts.map(p=>[p.lat,p.lon,1]),
      {radius,blur,maxZoom:17,max:1.0,gradient:{0.0:"#0a1628",0.2:"#1a1a5e",0.4:"#5b2c8e",0.6:"#c44ec2",0.8:"#ff85b8",1.0:"#ffe0f0"}}).addTo(map);
  }
  const mpwOn=document.getElementById("togMpwHeat").checked,denOn=document.getElementById("togDensityHeat").checked;
  const leg=document.getElementById("legend");
  if(!mpwOn&&!denOn){leg.style.display="none";return;} leg.style.display="";
  if(denOn&&!mpwOn){document.getElementById("legendTitle").textContent="Particle Density";document.getElementById("legendGradient").style.background="linear-gradient(to right,#0a1628,#1a1a5e,#5b2c8e,#c44ec2,#ff85b8,#ffe0f0)";}
  else{document.getElementById("legendTitle").textContent=mpwOn&&denOn?"MPW + Density":"MPW Intensity";document.getElementById("legendGradient").style.background="linear-gradient(to right,#0a1628,#003344,#00887a,"+ACCENT+",#ffc145,#ff6b6b)";}
}

function rebuildDots(){
  if(dotsLayer){map.removeLayer(dotsLayer);dotsLayer=null;}
  if(!document.getElementById("togDots").checked)return;
  const pts=getFiltered();if(!pts.length)return;
  const opacity=parseInt(document.getElementById("dotOpacitySlider").value)/100;
  const capPct=parseInt(document.getElementById("capSlider").value);
  const vals=pts.filter(p=>p.mpw>0).map(p=>p.mpw);
  const mx=Math.max(percentile(vals,capPct),0.001);
  dotsLayer=L.layerGroup();
  pts.forEach(p=>{
    const t=p.mpw>0?Math.min(Math.max(0.2,p.mpw/mx),1.0):0.15;
    const col=p.mpw>0?interpColor(t):"#556677";
    const m=L.circleMarker([p.lat,p.lon],{radius:3,weight:0,fillColor:col,fillOpacity:opacity});
    m.bindPopup(
      '<div class="popup-content"><div class="popup-title">Particle '+p.pid+'</div>'+
      '<strong>Released:</strong> '+p.year+'-'+String(p.month).padStart(2,'0')+'<br>'+
      '<strong>MPW:</strong> '+(p.mpw>0?p.mpw.toFixed(4)+' t':'N/A')+'<br>'+
      '<strong>Distance:</strong> '+p.dist.toFixed(1)+' km<br>'+
      '<div class="popup-divider"></div>'+
      '<strong>Trials beached:</strong> '+p.trials+'/'+p.trials_total+' ('+p.beach_pct+'%)<br>'+
      '<strong>Best bin conf:</strong> '+p.best_bin_pct+'%<br>'+
      '<strong>Unique bins:</strong> '+p.n_bins+'<br>'+
      '<div class="popup-divider"></div>'+
      '<strong>Consec days:</strong> avg '+p.avg_consec+', range '+p.min_consec+'\u2013'+p.max_consec+'<br>'+
      '<strong>Beach day:</strong> avg '+p.avg_day+', med '+p.med_day+'<br>'+
      '<strong>Range:</strong> '+p.min_day+'\u2013'+p.max_day+' days</div>'
    );
    dotsLayer.addLayer(m);
  });
  dotsLayer.addTo(map);
}

function interpColor(t){
  const stops=[[0,[0,51,68]],[0.3,[0,136,122]],[0.5,[137, 155, 47]],[0.7,[255,193,69]],[1,[255,107,107]]];
  for(let i=0;i<stops.length-1;i++){
    if(t<=stops[i+1][0]){const r=(t-stops[i][0])/(stops[i+1][0]-stops[i][0]);const[c0,c1]=[stops[i][1],stops[i+1][1]];
    return`rgb(${Math.round(c0[0]+r*(c1[0]-c0[0]))},${Math.round(c0[1]+r*(c1[1]-c0[1]))},${Math.round(c0[2]+r*(c1[2]-c0[2]))})`;}
  } return"rgb(255,107,107)";
}

function downloadShapefile(){
  const b=atob(SHP_ZIP_B64);const a8=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)a8[i]=b.charCodeAt(i);
  const blob=new Blob([a8],{type:"application/zip"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="stoch_florida_beached_shapefile.zip";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function downloadGeoJSON(){
  const filtered=getFiltered();
  const features=filtered.map(p=>({
    type:"Feature",geometry:{type:"Point",coordinates:[p.lon,p.lat]},
    properties:{pid:p.pid,year:p.year,month:p.month,mpw_tons:p.mpw,
      distance_km:p.dist,avg_beach_day:p.avg_day,median_beach_day:p.med_day,
      min_beach_day:p.min_day,max_beach_day:p.max_day,
      avg_consec_days:p.avg_consec,min_consec_days:p.min_consec,max_consec_days:p.max_consec,
      trials_beached:p.trials,trials_total:p.trials_total,
      beach_pct:p.beach_pct,best_bin_pct:p.best_bin_pct,n_unique_bins:p.n_bins,
      start_lat:p.start_lat,start_lon:p.start_lon},
  }));
  const geojson={type:"FeatureCollection",features};
  const blob=new Blob([JSON.stringify(geojson,null,2)],{type:"application/geo+json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="stoch_florida_beached.geojson";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
</script>
