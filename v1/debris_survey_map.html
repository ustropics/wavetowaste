<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoreline Debris Survey — Plastic Items Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-panel: #0f1923;
    --bg-panel-alpha: rgba(15, 25, 35, 0.92);
    --text-primary: #e8edf2;
    --text-secondary: #7a8fa3;
    --accent: #899b2f;
    --accent-rgb: 137, 155, 47;
    --accent-dim: rgba(137, 155, 47, 0.15);
    --danger: #ff6b6b;
    --warning: #ffc145;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0f14;
    color: var(--text-primary);
    overflow: hidden; height: 100vh; width: 100vw;
  }

  #map { position: absolute; inset: 0; z-index: 1; }

  .panel {
    position: absolute; top: 16px; left: 16px; z-index: 1000;
    background: var(--bg-panel-alpha);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
    width: 310px; box-shadow: var(--shadow); overflow: hidden;
  }
  .panel.collapsed .panel-body { display: none; }
  .panel.collapsed { width: auto; }

  .panel-header {
    padding: 16px 18px; display: flex; align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer; user-select: none;
  }
  .panel-header:hover { background: rgba(255,255,255,0.03); }

  .panel-title {
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--accent);
  }
  .panel-toggle {
    font-size: 18px; color: var(--text-secondary); transition: transform 0.3s;
  }
  .panel.collapsed .panel-toggle { transform: rotate(180deg); }
  .panel-body { padding: 14px 18px 18px; }

  .layer-section { margin-bottom: 14px; }
  .layer-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px;
  }

  .layer-toggle {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    transition: background 0.15s; margin-bottom: 4px;
  }
  .layer-toggle:hover { background: rgba(255,255,255,0.04); }
  .layer-toggle input[type="checkbox"] { display: none; }

  .toggle-track {
    width: 36px; height: 20px; border-radius: 10px;
    background: #2a3a4a; position: relative;
    transition: background 0.2s; flex-shrink: 0;
  }
  .toggle-track::after {
    content: ''; width: 16px; height: 16px; border-radius: 50%;
    background: #556; position: absolute; top: 2px; left: 2px;
    transition: all 0.2s;
  }
  .layer-toggle input:checked + .toggle-track { background: var(--accent); }
  .layer-toggle input:checked + .toggle-track::after { background: #fff; left: 18px; }

  .toggle-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .toggle-sub { font-size: 11px; color: var(--text-secondary); }

  .slider-group {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .slider-row { margin-bottom: 10px; }
  .slider-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-secondary); margin-bottom: 4px;
  }
  .slider-value {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent); font-size: 11px;
  }
  input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 4px;
    border-radius: 2px; background: #2a3a4a; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.4);
  }

  .stats-bar {
    position: absolute; bottom: 16px; left: 50%;
    transform: translateX(-50%); z-index: 1000;
    background: var(--bg-panel-alpha); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 10px;
    padding: 12px 24px; display: flex; gap: 32px; box-shadow: var(--shadow);
  }
  .stat-item { text-align: center; }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; font-weight: 700; color: var(--accent); line-height: 1.2;
  }
  .stat-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--text-secondary);
  }

  .leaflet-popup-content-wrapper {
    background: var(--bg-panel) !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
    border-radius: 8px !important;
    color: var(--text-primary) !important;
    box-shadow: var(--shadow) !important;
  }
  .leaflet-popup-tip { background: var(--bg-panel) !important; }
  .popup-content {
    font-family: 'DM Sans', sans-serif; font-size: 12px; line-height: 1.6;
  }
  .popup-content strong { color: var(--accent); font-weight: 600; }
  .popup-site {
    font-size: 14px; font-weight: 700; margin-bottom: 6px;
    color: var(--text-primary);
  }

  .legend {
    position: absolute; bottom: 80px; right: 16px; z-index: 1000;
    background: var(--bg-panel-alpha); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 10px;
    padding: 14px 16px; box-shadow: var(--shadow); min-width: 160px;
  }
  .legend-title {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px;
  }
  .legend-gradient { width: 100%; height: 12px; border-radius: 6px; margin-bottom: 4px; }
  .legend-labels {
    display: flex; justify-content: space-between;
    font-size: 10px; font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
  }

  .year-filters {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .year-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .year-pill {
    padding: 3px 9px; border-radius: 4px;
    font-size: 11px; font-family: 'JetBrains Mono', monospace;
    font-weight: 500; background: #2a3a4a; color: var(--text-secondary);
    cursor: pointer; border: 1px solid transparent; transition: all 0.15s;
  }
  .year-pill.active {
    background: var(--accent-dim); color: var(--accent);
    border-color: rgba(var(--accent-rgb), 0.3);
  }
  .year-pill:hover { background: rgba(255,255,255,0.08); }
  .year-pill.active:hover { background: rgba(var(--accent-rgb), 0.25); }

  .download-section {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .download-btn {
    width: 100%; padding: 10px 14px;
    border: 1px solid rgba(var(--accent-rgb), 0.3); border-radius: 6px;
    background: var(--accent-dim); color: var(--accent);
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .download-btn:hover {
    background: rgba(var(--accent-rgb), 0.25); border-color: var(--accent);
  }
  .download-btn:active { transform: scale(0.98); }
  .download-btn svg {
    width: 14px; height: 14px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- Control Panel -->
<div class="panel" id="controlPanel">
  <div class="panel-header" onclick="document.getElementById('controlPanel').classList.toggle('collapsed')">
    <span class="panel-title">Debris Survey Layers</span>
    <span class="panel-toggle">&#9660;</span>
  </div>
  <div class="panel-body">
    <div class="layer-section">
      <div class="layer-section-label">Heatmaps</div>
      <label class="layer-toggle">
        <input type="checkbox" id="togPlasticHeat" checked>
        <span class="toggle-track"></span>
        <span><span class="toggle-label">Plastic Items Heatmap</span><br>
        <span class="toggle-sub">Weighted by total_plastic_items</span></span>
      </label>
      <label class="layer-toggle">
        <input type="checkbox" id="togDensityHeat">
        <span class="toggle-track"></span>
        <span><span class="toggle-label">Survey Density Heatmap</span><br>
        <span class="toggle-sub">Count-based gradient</span></span>
      </label>
    </div>
    <div class="layer-section">
      <div class="layer-section-label">Overlays</div>
      <label class="layer-toggle">
        <input type="checkbox" id="togDots">
        <span class="toggle-track"></span>
        <span><span class="toggle-label">Site Markers</span><br>
        <span class="toggle-sub">Centroid dot per survey</span></span>
      </label>
      <label class="layer-toggle">
        <input type="checkbox" id="togBbox" checked>
        <span class="toggle-track"></span>
        <span><span class="toggle-label">Site Bounding Boxes</span><br>
        <span class="toggle-sub">4-corner survey polygons</span></span>
      </label>
    </div>

    <div class="slider-group">
      <div class="slider-row">
        <div class="slider-label"><span>Heatmap Radius</span><span class="slider-value" id="radiusVal">25</span></div>
        <input type="range" id="radiusSlider" min="5" max="60" value="25">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>Heatmap Blur</span><span class="slider-value" id="blurVal">15</span></div>
        <input type="range" id="blurSlider" min="1" max="40" value="15">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>Intensity Cap (percentile)</span><span class="slider-value" id="capVal">75</span></div>
        <input type="range" id="capSlider" min="10" max="100" value="75">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>Dot Opacity</span><span class="slider-value" id="dotOpacityVal">0.7</span></div>
        <input type="range" id="dotOpacitySlider" min="10" max="100" value="70">
      </div>
    </div>

    <div class="year-filters">
      <div class="layer-section-label">Filter by Year</div>
      <div class="year-pills" id="yearPills"></div>
    </div>

    <div class="download-section">
      <div class="layer-section-label">Export</div>
      <button class="download-btn" onclick="downloadGeoJSON()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Filtered GeoJSON
      </button>
    </div>
  </div>
</div>

<!-- Legend -->
<div class="legend" id="legend">
  <div class="legend-title" id="legendTitle">Plastic Items Intensity</div>
  <div class="legend-gradient" id="legendGradient"
       style="background: linear-gradient(to right, #0a1628, #003344, #00887a, #899b2f, #ffc145, #ff6b6b);"></div>
  <div class="legend-labels"><span>Low</span><span>High</span></div>
</div>

<!-- Stats Bar -->
<div class="stats-bar">
  <div class="stat-item"><div class="stat-value" id="statSurveys">&mdash;</div><div class="stat-label">Surveys</div></div>
  <div class="stat-item"><div class="stat-value" id="statPlastic">&mdash;</div><div class="stat-label">Plastic Items</div></div>
  <div class="stat-item"><div class="stat-value" id="statSites">&mdash;</div><div class="stat-label">Unique Sites</div></div>
  <div class="stat-item"><div class="stat-value" id="statYears">&mdash;</div><div class="stat-label">Years</div></div>
</div>

const allSites = MAP_DATA.sites || [];
const stats    = MAP_DATA.stats || {};

let activeYears = new Set();
let plasticHeatLayer = null, densityHeatLayer = null;
let dotsLayer = null, bboxLayer = null;

const ACCENT = "#899b2f";

// ═══════════════════════════════════════════════════════════
// Map init
// ═══════════════════════════════════════════════════════════
const map = L.map("map", { center: [27.5, -83.0], zoom: 7, zoomControl: false });
L.control.zoom({ position: "topright" }).addTo(map);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: "abcd", maxZoom: 19 }
).addTo(map);

// ═══════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════
(function init() {
  const years = [...new Set(allSites.map(s => s.year))].sort();
  activeYears = new Set(years);
  const pillsEl = document.getElementById("yearPills");

  const allPill = document.createElement("span");
  allPill.className = "year-pill active";
  allPill.textContent = "All";
  allPill.onclick = () => { activeYears = new Set(years); updatePills(); rebuildLayers(); };
  pillsEl.appendChild(allPill);

  years.forEach(y => {
    const pill = document.createElement("span");
    pill.className = "year-pill active";
    pill.dataset.year = y;
    pill.textContent = y;
    pill.onclick = () => {
      if (activeYears.has(y)) activeYears.delete(y); else activeYears.add(y);
      updatePills(); rebuildLayers();
    };
    pillsEl.appendChild(pill);
  });

  document.getElementById("statSurveys").textContent = allSites.length.toLocaleString();
  document.getElementById("statPlastic").textContent = (stats.total_plastic || 0).toLocaleString();
  document.getElementById("statSites").textContent = stats.unique_sites || 0;
  document.getElementById("statYears").textContent = years.length > 1
    ? years[0] + "\u2013" + years[years.length-1] : (years[0] || "\u2014");

  rebuildLayers();

  if (allSites.length > 0) {
    const lats = allSites.map(s => s.lat);
    const lons = allSites.map(s => s.lon);
    map.fitBounds([
      [Math.min(...lats) - 0.5, Math.min(...lons) - 0.5],
      [Math.max(...lats) + 0.5, Math.max(...lons) + 0.5],
    ]);
  }

  ["togPlasticHeat","togDensityHeat","togDots","togBbox"].forEach(id =>
    document.getElementById(id).addEventListener("change", rebuildLayers));

  document.getElementById("radiusSlider").addEventListener("input", e => {
    document.getElementById("radiusVal").textContent = e.target.value; rebuildHeatmaps();
  });
  document.getElementById("blurSlider").addEventListener("input", e => {
    document.getElementById("blurVal").textContent = e.target.value; rebuildHeatmaps();
  });
  document.getElementById("capSlider").addEventListener("input", e => {
    document.getElementById("capVal").textContent = e.target.value;
    rebuildHeatmaps(); rebuildDots(); rebuildBbox();
  });
  document.getElementById("dotOpacitySlider").addEventListener("input", e => {
    document.getElementById("dotOpacityVal").textContent = (e.target.value/100).toFixed(2);
    rebuildDots();
  });
})();

// ═══════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════
function updatePills() {
  const pills = document.querySelectorAll(".year-pill");
  const years = [...new Set(allSites.map(s => s.year))].sort();
  pills.forEach(pill => {
    if (pill.textContent === "All") pill.classList.toggle("active", activeYears.size === years.length);
    else pill.classList.toggle("active", activeYears.has(parseInt(pill.dataset.year)));
  });
}

function getFiltered() { return allSites.filter(s => activeYears.has(s.year)); }

function percentile(arr, pct) {
  if (arr.length === 0) return 0;
  const sorted = [...arr].sort((a,b) => a - b);
  const idx = Math.ceil((pct/100) * sorted.length) - 1;
  return sorted[Math.max(0, idx)];
}

function rebuildLayers() {
  rebuildHeatmaps(); rebuildDots(); rebuildBbox();
  const f = getFiltered();
  document.getElementById("statSurveys").textContent = f.length.toLocaleString();
  document.getElementById("statPlastic").textContent =
    f.reduce((s, p) => s + p.plastic, 0).toLocaleString();
  const uniqueFiltered = new Set(f.map(s => s.name)).size;
  document.getElementById("statSites").textContent = uniqueFiltered;
}

// ═══════════════════════════════════════════════════════════
// Heatmaps
// ═══════════════════════════════════════════════════════════
function rebuildHeatmaps() {
  const pts    = getFiltered();
  const radius = parseInt(document.getElementById("radiusSlider").value);
  const blur   = parseInt(document.getElementById("blurSlider").value);
  const capPct = parseInt(document.getElementById("capSlider").value);

  if (plasticHeatLayer) { map.removeLayer(plasticHeatLayer); plasticHeatLayer = null; }
  if (document.getElementById("togPlasticHeat").checked && pts.length > 0) {
    const vals = pts.filter(s => s.plastic > 0).map(s => s.plastic);
    const mx = Math.max(percentile(vals, capPct), 1);
    plasticHeatLayer = L.heatLayer(
      pts.filter(s => s.plastic > 0).map(s => [s.lat, s.lon, Math.min(s.plastic / mx, 1.0)]),
      { radius, blur, maxZoom: 17, max: 1.0,
        gradient: { 0.0:"#0a1628", 0.2:"#003344", 0.4:"#00887a", 0.6:ACCENT, 0.8:"#ffc145", 1.0:"#ff6b6b" } }
    ).addTo(map);
  }

  if (densityHeatLayer) { map.removeLayer(densityHeatLayer); densityHeatLayer = null; }
  if (document.getElementById("togDensityHeat").checked && pts.length > 0) {
    densityHeatLayer = L.heatLayer(
      pts.map(s => [s.lat, s.lon, 1]),
      { radius, blur, maxZoom: 17, max: 1.0,
        gradient: { 0.0:"#0a1628", 0.2:"#1a1a5e", 0.4:"#5b2c8e", 0.6:"#c44ec2", 0.8:"#ff85b8", 1.0:"#ffe0f0" } }
    ).addTo(map);
  }

  updateLegend();
}

function updateLegend() {
  const plOn  = document.getElementById("togPlasticHeat").checked;
  const denOn = document.getElementById("togDensityHeat").checked;
  const leg   = document.getElementById("legend");
  if (!plOn && !denOn) { leg.style.display = "none"; return; }
  leg.style.display = "";
  if (denOn && !plOn) {
    document.getElementById("legendTitle").textContent = "Survey Density";
    document.getElementById("legendGradient").style.background =
      "linear-gradient(to right, #0a1628, #1a1a5e, #5b2c8e, #c44ec2, #ff85b8, #ffe0f0)";
  } else {
    document.getElementById("legendTitle").textContent = plOn && denOn ? "Plastic + Density" : "Plastic Items Intensity";
    document.getElementById("legendGradient").style.background =
      "linear-gradient(to right, #0a1628, #003344, #00887a, " + ACCENT + ", #ffc145, #ff6b6b)";
  }
}

// ═══════════════════════════════════════════════════════════
// Site dots
// ═══════════════════════════════════════════════════════════
function rebuildDots() {
  if (dotsLayer) { map.removeLayer(dotsLayer); dotsLayer = null; }
  if (!document.getElementById("togDots").checked) return;
  const pts = getFiltered();
  if (pts.length === 0) return;

  const opacity = parseInt(document.getElementById("dotOpacitySlider").value) / 100;
  const capPct  = parseInt(document.getElementById("capSlider").value);
  const vals    = pts.filter(s => s.plastic > 0).map(s => s.plastic);
  const mx      = Math.max(percentile(vals, capPct), 1);
  dotsLayer = L.layerGroup();

  pts.forEach(s => {
    const t   = s.plastic > 0 ? Math.min(Math.max(0.15, s.plastic / mx), 1.0) : 0.1;
    const col = s.plastic > 0 ? interpColor(t) : "#334455";
    const m   = L.circleMarker([s.lat, s.lon], {
      radius: 5, weight: 1, color: "rgba(255,255,255,0.2)",
      fillColor: col, fillOpacity: opacity,
    });
    m.bindPopup(makePopup(s));
    dotsLayer.addLayer(m);
  });
  dotsLayer.addTo(map);
}

// ═══════════════════════════════════════════════════════════
// Bounding box polygons
// ═══════════════════════════════════════════════════════════
function rebuildBbox() {
  if (bboxLayer) { map.removeLayer(bboxLayer); bboxLayer = null; }
  if (!document.getElementById("togBbox").checked) return;
  const pts = getFiltered();
  if (pts.length === 0) return;

  const capPct = parseInt(document.getElementById("capSlider").value);
  const vals   = pts.filter(s => s.plastic > 0).map(s => s.plastic);
  const mx     = Math.max(percentile(vals, capPct), 1);
  bboxLayer = L.layerGroup();

  pts.forEach(s => {
    const t   = s.plastic > 0 ? Math.min(Math.max(0.1, s.plastic / mx), 1.0) : 0.05;
    const col = s.plastic > 0 ? interpColor(t) : "#334455";

    const poly = L.polygon(s.bbox, {
      color: col, weight: 2, opacity: 0.8,
      fillColor: col, fillOpacity: 0.25,
    });
    poly.bindPopup(makePopup(s));
    bboxLayer.addLayer(poly);
  });
  bboxLayer.addTo(map);
}

// ═══════════════════════════════════════════════════════════
// Popup builder
// ═══════════════════════════════════════════════════════════
function makePopup(s) {
  return '<div class="popup-content">' +
    '<div class="popup-site">' + s.name + '</div>' +
    '<strong>Date:</strong> ' + s.date + '<br>' +
    '<strong>Plastic items:</strong> ' + s.plastic.toLocaleString() + '<br>' +
    '<strong>Total debris:</strong> ' + s.debris.toLocaleString() + '<br>' +
    '<strong>Beach width:</strong> ' + s.width + ' m<br>' +
    '<strong>County:</strong> ' + s.county + '<br>' +
    '<strong>State:</strong> ' + s.state +
    '</div>';
}

// ═══════════════════════════════════════════════════════════
// Color interpolation
// ═══════════════════════════════════════════════════════════
function interpColor(t) {
  const stops = [
    [0,   [0, 51, 68]],
    [0.3, [0, 136, 122]],
    [0.5, [137, 155, 47]],
    [0.7, [255, 193, 69]],
    [1,   [255, 107, 107]],
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t <= stops[i+1][0]) {
      const r2 = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      const [c0,c1] = [stops[i][1], stops[i+1][1]];
      return `rgb(${Math.round(c0[0]+r2*(c1[0]-c0[0]))},${Math.round(c0[1]+r2*(c1[1]-c0[1]))},${Math.round(c0[2]+r2*(c1[2]-c0[2]))})`;
    }
  }
  return "rgb(255,107,107)";
}

// ═══════════════════════════════════════════════════════════
// GeoJSON export (filtered data, bbox as polygon geometry)
// ═══════════════════════════════════════════════════════════
function downloadGeoJSON() {
  const filtered = getFiltered();
  const features = filtered.map(s => ({
    type: "Feature",
    geometry: {
      type: "Polygon",
      coordinates: [s.bbox.map(([lat,lon]) => [lon, lat]).concat([
        [s.bbox[0][1], s.bbox[0][0]]  // close the ring
      ])],
    },
    properties: {
      site_name: s.name, survey_date: s.date,
      total_plastic_items: s.plastic, total_debris_items: s.debris,
      beach_width_m: s.width, county: s.county, state: s.state,
      centroid_lat: s.lat, centroid_lon: s.lon,
    },
  }));
  const geojson = { type: "FeatureCollection", features };
  const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/geo+json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "debris_surveys.geojson";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
</script>
